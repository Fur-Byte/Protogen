[platformio]
default_envs = helmet
build_dir = ../../build/esp32

[env]
platform = espressif32@7.1.3
framework = espidf
monitor_speed = 115200
board_upload.maximum_size = 1536000
board_build.partitions = partitions_singleapp_large.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -std=gnu++17 -I../PROT_OS7_MAX7219/src/HelmetProtocol

[env:helmet]
board = esp32-c3-devkitm-1
board_build.esp-idf.sdkconfig_path = ../../build/sdkconfig.helmet
build_flags = ${env.build_flags} -DHELMET_RECEIVER=1

[env:paw]
board = seeed_xiao_esp32c3
board_build.esp-idf.sdkconfig_path = ../../build/sdkconfig.paw
build_flags = ${env.build_flags} -DPAW_CONTROLLER=1
