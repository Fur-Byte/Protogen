name: Firmware regression and builds
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build python3-venv
      - name: Pinned toolchains
        run: python3 scripts/install-toolchains.py
      - name: Regressions, optimized Python, features and both wireless roles
        shell: bash
        run: |
          source build/toolchains/environment.sh
          scripts/test-firmware.sh
          scripts/test-efficiency.sh
          python3 -O scripts/tests/test-tools.py
          python3 -O scripts/tests/test-helmet-tool.py
          python3 -O scripts/tests/test-pair-paw.py
          python3 -O scripts/tests/test-efficiency.py
          python3 -O scripts/tests/test-host-build.py
          CMAKE=cmake CC=clang CXX=clang++ scripts/test-wireless.sh
          CMAKE=cmake CC=clang CXX=clang++ scripts/test-v4.sh
          CMAKE=cmake CC=clang CXX=clang++ scripts/test-dtls.sh
          python3 scripts/tests/v4/make_vectors.py --check
          python3 scripts/check-features.py
          python3 scripts/check-extensions.py
          python3 scripts/check-uart-auth.py
          python3 scripts/build.py
          python3 scripts/build-esp32.py
          for candidate in cache_face case_2hz oled_1hz oled_pages checkpoint_5min wearer_deadlines main_events oled_protection; do
            python3 scripts/build-efficiency.py "$candidate"
          done
          # Auth uses temporary fixture keys; restore the unauthenticated default
          # export afterwards. No device provisioning or uploads occur.
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          python3 scripts/provision-uart-auth.py --output "$key_dir/private"
          PROTOGEN_UART_KEY_DIR="$key_dir/private" python3 scripts/build-esp32.py
          python3 scripts/build-esp32.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-evidence
          path: |
            build/*json
            build/*log
            build/runs/**/manifest.json
            build/runs/**/compile.log
            build/runs/**/esp32.log
            build/toolchains/lock.json
            build/toolchains/python-dependencies.txt
            build/toolchains/idf-python-dependencies.txt
