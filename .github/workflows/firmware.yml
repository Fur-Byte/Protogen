name: Firmware regression and builds
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '32 9 * * 1'
concurrency:
  group: firmware-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  MATRIX_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && 'full' || 'fast' }}
jobs:
  host-and-c3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Host prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build python3-venv nodejs
          mkdir -p build/toolchains
          dpkg-query -W clang cmake ninja-build python3-venv nodejs > build/toolchains/host-packages.txt
          { clang --version; cmake --version; ninja --version; python3 --version; node --version; } > build/toolchains/host-versions.txt
      - name: Pinned toolchains
        run: python3 scripts/install-toolchains.py
      - name: Fast deterministic twin
        shell: bash
        run: |
          source build/toolchains/environment.sh
          mkdir -p build/twin
          make -C scripts/twin 2>&1 | tee build/twin/build.log
          python3 scripts/twin/test_replay.py --evidence build/twin/fast 2>&1 | tee build/twin/fast.log
          python3 scripts/twin/replay.py scripts/twin/fixtures/visibility.json --report build/twin/identity.json --trace build/twin/visibility.tsv
      - name: Deep deterministic twin
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: python3 scripts/twin/test_replay.py --deep --evidence build/twin/deep 2>&1 | tee build/twin/deep.log
      - name: Flight recorder host parity and export guards
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/test-flight-recorder.py
          python3 scripts/check-golden-frames.py --recorder-enabled
      - name: Extended recorder and replay faults
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/test-flight-recorder.py --deep
      - name: Portable behavior core and independent P3 parity
        shell: bash
        run: |
          source build/toolchains/environment.sh
          make -C scripts/twin behavior-core-test
          python3 scripts/check-behavior-parity.py
      - name: Deep independent behavior parity
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-behavior-parity.py --deep
      - name: Animation V2 scheduling, independent visuals and dirty SPI
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-animation-v2.py
      - name: Extended Animation V2 replay stress
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-animation-v2.py --deep
      - name: Timeline compiler, runtime and Face Studio replay
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/tests/test-timeline-compiler.py
          node scripts/tests/test-timeline-editor.js
          python3 scripts/check-timelines.py
      - name: Deep timeline seeking
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-timelines.py --deep
      - name: Audio V2 held-out activity, mouth pixels and feature interactions
        shell: bash
        run: |
          source build/toolchains/environment.sh
          mkdir -p build/p7-evidence
          python3 scripts/check-audio.py --held-out 2>&1 | tee build/p7-evidence/held-out.log
          python3 scripts/check-audio-profiles.py 2>&1 | tee build/p7-evidence/profiles.log
      - name: Extended Audio V2 synthetic replay
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-audio.py 2>&1 | tee build/p7-evidence/development.log
      - name: Host regressions, metadata and mutation checks
        shell: bash
        run: |
          source build/toolchains/environment.sh
          export CMAKE=cmake CC=clang CXX=clang++
          python3 scripts/check-baseline.py
          python3 scripts/check-golden-frames.py
          python3 scripts/generate-config-metadata.py --check
          bash scripts/test-config-compatibility.sh
          python3 scripts/check-invalid-configurations.py
          python3 scripts/check-invariant-mutations.py --group full
      - name: Both C3 roles with UART auth on and off
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-build-matrix.py "$MATRIX_MODE" esp32
      - name: C3 recorder linker budgets
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-flight-builds.py c3
      - name: Efficiency interactions and isolated research preflights
        if: env.MATRIX_MODE == 'full'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          export CMAKE=cmake CC=clang CXX=clang++ PROTOGEN_PIO_JOBS=4
          python3 scripts/build-efficiency.py case_2hz --with oled_1hz --with oled_pages --with oled_protection --with checkpoint_5min --with wearer_deadlines --with main_events
          python3 scripts/check-mlkem-preflight.py
          python3 scripts/check-v4.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Keep diagnostics for maintainer runs, including failures. Fork PRs still run the checks.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          retention-days: 30
          include-hidden-files: false
          name: host-and-c3-evidence
          path: |
            build/archive-face-comparison.json
            build/compile.log
            build/current-build.json
            build/efficiency-checks.log
            build/efficiency-results.json
            build/esp32-build.json
            build/esp32-build.log
            build/extensions-checks.log
            build/extensions-results.json
            build/feature-checks.log
            build/feature-results.json
            build/latest-successful-build.json
            build/uart-auth-checks.log
            build/uart-auth-results.json
            build/wireless-benchmark.json
            build/baseline-host/**/*.json
            build/baseline-host/**/*.log
            build/mutation-evidence/**/*.json
            build/mutation-evidence/**/*.log
            build/flight-evidence/**/*.json
            build/flight-evidence/**/*.log
            build/flight-evidence/**/*.tsv
            build/p4-evidence/**/*.json
            build/p4-evidence/**/*.json.gz
            build/p5-evidence/**/*.json
            build/p5-evidence/**/*.tsv
            build/p6-evidence/**/*.json
            build/p6-evidence/**/*.tsv
            build/p7-evidence/**/*.json
            build/p7-evidence/**/*.log
            build/p7-evidence/**/*.tsv
            build/p7-evidence/**/*.txt
            build/matrix-*-esp32/**/*.json
            build/matrix-*-esp32/**/*.log
            build/twin/*.json
            build/twin/*.log
            build/twin/*.tsv
            build/twin/fast/**/*.json
            build/twin/fast/**/*.log
            build/twin/fast/**/*.tsv
            build/twin/deep/**/*.json
            build/twin/deep/**/*.log
            build/twin/deep/**/*.tsv
            build/runs/**/manifest.json
            build/runs/**/compile.log
            build/runs/**/esp32.log
            build/toolchains/lock.json
            build/toolchains/python-dependencies.txt
            build/toolchains/idf-python-dependencies.txt
            build/toolchains/host-packages.txt
            build/toolchains/host-versions.txt
  teensy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["plain","auth"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pinned Teensy toolchain
        run: python3 scripts/install-toolchains.py --teensy-only
      - name: Teensy feature combinations
        shell: bash
        env:
          TEENSY_GROUP: ${{ matrix.group }}
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-build-matrix.py "$MATRIX_MODE" teensy --group "$TEENSY_GROUP"
      - name: Teensy recorder RAM2 placement and sizes
        if: matrix.group != 'auth'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-flight-builds.py teensy
      - name: Behavior core target footprint and stack report
        if: matrix.group != 'auth'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-behavior-build.py --animation-v2 --output build/p5-evidence/target.json
      - name: Linked timeline asset and footprint
        if: matrix.group != 'auth'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-timeline-build.py
      - name: Audio V2 Teensy dependency matrix and footprint
        if: matrix.group != 'auth'
        shell: bash
        run: |
          source build/toolchains/environment.sh
          python3 scripts/check-audio-profiles.py --target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Keep diagnostics for maintainer runs, including failures. Fork PRs still run the checks.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          retention-days: 30
          include-hidden-files: false
          name: teensy-evidence-${{ matrix.group }}
          path: |
            build/runs/**/manifest.json
            build/runs/**/compile.log
            build/flight-evidence/**/*.json
            build/flight-evidence/**/*.log
            build/flight-evidence/**/*.tsv
            build/p5-evidence/target.json
            build/p6-evidence/target.json
            build/p7-evidence/target.json
            build/toolchains/lock.json
